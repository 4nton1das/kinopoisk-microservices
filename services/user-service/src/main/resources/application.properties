spring.application.name=user-service

# Два разных порта:
# - 9090 для gRPC
# - 9091 для HTTP (Actuator)
server.port=9091
grpc.server.port=9090

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10000

# Publisher Confirms (публикуем события в Fanout)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Retry для надежности
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2000
spring.rabbitmq.template.retry.max-attempts=5

# Actuator на HTTP порту 9091
management.server.port=9091
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Metrics
management.metrics.export.prometheus.enabled=true

# Observability
spring.rabbitmq.template.observation-enabled=true

# Отключаем ненужные зависимости
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
