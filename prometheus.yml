global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kinopoisk-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'kinopoisk-service:8080'
          - 'audit-service:8082'
          - 'notification-service:8083'
          - 'user-service:9091'  # HTTP порт для актуаторов
        labels:
          group: 'microservices'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']